<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Synthwave Dodge: Arcade Survival VR</title>
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.8.2/aframe.min.js"></script>
  <!-- Tailwind CSS for UI Overlay -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #050312;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
    }

    .glow-text-cyan {
      text-shadow: 0 0 8px #00ffff, 0 0 20px #00ffff;
    }

    .glow-text-pink {
      text-shadow: 0 0 8px #ff007f, 0 0 20px #ff007f;
    }

    .glow-box-pink {
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .glow-box-cyan {
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(0, 255, 255, 0.4);
    }

    .glow-box-yellow {
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.6), inset 0 0 15px rgba(234, 179, 8, 0.4);
    }

    /* Style A-Frame VR Button */
    .a-enter-vr {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 50 !important;
    }

    /* Scene and canvas layout */
    a-scene {
      width: 100vw !important;
      height: 100vh !important;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    canvas.fallback-canvas {
      width: 100vw !important;
      height: 100vh !important;
      display: none; /* Only visible if WebGL fails */
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
  </style>
</head>
<body class="bg-black text-white">

  <!-- HUD & UI OVERLAY CONTAINER -->
  <div id="ui-container" class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-4 sm:p-6">
    
    <!-- TOP BAR HUD WITH TIMER, LIVE SCORE & CONTROLS -->
    <div class="flex flex-wrap justify-between items-center w-full max-w-5xl mx-auto gap-3">
      
      <!-- STATUS DISPLAY -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-cyan-500/50 rounded-xl px-4 py-2 flex items-center gap-3 glow-box-cyan">
        <span class="text-xs text-cyan-400 font-bold uppercase tracking-wider">Status</span>
        <span id="status-val" class="text-xs sm:text-sm font-bold text-cyan-300 font-pixel">READY</span>
      </div>

      <!-- TIMER DISPLAY -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-yellow-500/50 rounded-xl px-4 py-2 flex items-center gap-3 glow-box-yellow">
        <span class="text-xs text-yellow-400 font-bold uppercase tracking-wider">Time</span>
        <span id="hud-timer" class="text-xs sm:text-sm font-bold text-yellow-300 font-pixel">00:00.0</span>
      </div>

      <!-- LIVE SCORE DISPLAY -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-pink-500/50 rounded-xl px-4 py-2 flex items-center gap-3 glow-box-pink">
        <span class="text-xs text-pink-400 font-bold uppercase tracking-wider">Score</span>
        <span id="hud-score" class="text-xs sm:text-sm font-bold text-pink-300 font-pixel">0</span>
      </div>

      <!-- CONTROLS HINT DISPLAY -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-pink-500/50 rounded-xl px-4 py-2 flex items-center gap-3 glow-box-pink">
        <span class="text-xs text-pink-400 font-bold uppercase tracking-wider">Controls</span>
        <span class="text-xs font-bold text-pink-300 font-pixel">A / D / VR GRAB</span>
      </div>
    </div>

    <!-- TOUCH CONTROLS FOR MOBILE DEVICES -->
    <div class="sm:hidden pointer-events-auto flex justify-between w-full max-w-xs mx-auto mb-4 gap-6 z-20">
      <button id="btn-left" class="flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 active:from-cyan-400 active:to-blue-400 text-white font-bold py-5 rounded-2xl border-2 border-cyan-300 text-2xl shadow-lg active:scale-95 transition-all text-center select-none">
        &#9664; A
      </button>
      <button id="btn-right" class="flex-1 bg-gradient-to-r from-pink-600 to-purple-600 active:from-pink-400 active:to-purple-400 text-white font-bold py-5 rounded-2xl border-2 border-pink-300 text-2xl shadow-lg active:scale-95 transition-all text-center select-none">
        D &#9654;
      </button>
    </div>

    <!-- INSTRUCTION / GAME OVER OVERLAY -->
    <div id="start-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md pointer-events-auto flex flex-col items-center justify-center text-center p-6 z-30">
      <h1 class="text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 mb-2 glow-text-pink">
        CYBER DODGE
      </h1>
      <p id="overlay-subtitle" class="text-cyan-300 text-sm sm:text-base mb-6 max-w-md tracking-wide">
        Dodge the falling plasma orbs from above!
      </p>

      <div class="bg-slate-900/90 border border-slate-700 rounded-xl p-5 sm:p-6 mb-6 max-w-md w-full shadow-2xl text-left space-y-3">
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Move Left:</span>
          <span class="px-2.5 py-1 bg-slate-800 border border-cyan-400 rounded text-cyan-300 font-mono font-bold">A / Left Arrow</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Move Right:</span>
          <span class="px-2.5 py-1 bg-slate-800 border border-pink-400 rounded text-pink-300 font-mono font-bold">D / Right Arrow</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">VR Control:</span>
          <span class="px-2.5 py-1 bg-slate-800 border border-purple-400 rounded text-purple-300 font-mono font-bold">Grip & Drag Ship</span>
        </div>
        <div class="flex items-center justify-between text-sm pt-2 border-t border-slate-800">
          <span class="text-gray-400">Survival Time:</span>
          <span id="final-time" class="text-yellow-400 font-mono font-bold">00:00.0</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Final Score:</span>
          <span id="score-display" class="text-pink-400 font-mono font-bold">0</span>
        </div>
      </div>

      <button id="start-btn" class="pointer-events-auto px-8 py-4 bg-gradient-to-r from-cyan-500 via-pink-500 to-purple-600 hover:from-cyan-400 hover:to-pink-400 text-white font-black text-xl rounded-full shadow-xl glow-box-pink transform hover:scale-105 active:scale-95 transition-all cursor-pointer">
        START GAME
      </button>
    </div>

  </div>

  <!-- FALLBACK CANVAS FOR DIRECT 2D RENDER IF WEBGL FAILS -->
  <canvas id="fallback-canvas" class="fallback-canvas"></canvas>

  <!-- A-FRAME 3D SCENE -->
  <a-scene id="main-scene" embedded vr-mode-ui="enabled: true">
    <!-- CAMERA RIG WITH VR CONTROLLERS -->
    <a-entity id="camera-rig" position="0 0 10">
      <a-camera id="main-camera" look-controls="enabled: false" wasd-controls="enabled: false" fov="50"></a-camera>

      <!-- LEFT VR CONTROLLER -->
      <a-entity id="left-hand" 
                laser-controls="hand: left" 
                raycaster="objects: .grabbable; far: 25"
                oculus-touch-controls="hand: left"
                vive-controls="hand: left">
      </a-entity>

      <!-- RIGHT VR CONTROLLER -->
      <a-entity id="right-hand" 
                laser-controls="hand: right" 
                raycaster="objects: .grabbable; far: 25"
                oculus-touch-controls="hand: right"
                vive-controls="hand: right">
      </a-entity>
    </a-entity>

    <!-- LIGHTING -->
    <a-ambient-light color="#ffffff" intensity="1.5"></a-ambient-light>
    <a-directional-light color="#00ffff" intensity="1.0" position="-5 10 5"></a-directional-light>

    <!-- SYNTHWAVE SKY BACKGROUND -->
    <a-sky color="#08041d"></a-sky>

    <!-- CONTAINER FOR DYNAMIC OBSTACLES -->
    <a-entity id="obstacle-container"></a-entity>

    <!-- MAIN PLATFORM (FLOOR WHERE PLAYER MOVES) -->
    <a-entity id="platform-group" position="0 -2.5 0">
      <!-- Platform Base -->
      <a-box id="platform-mesh" position="0 -0.5 0" width="12" height="1" depth="2" color="#1a0c3b"></a-box>
      <!-- Left & Right Boundary Pillars -->
      <a-box position="-5.2 1 0" width="0.3" height="2" depth="0.5" color="#ff007f" material="emissive: #ff007f; emissiveIntensity: 0.8"></a-box>
      <a-box position="5.2 1 0" width="0.3" height="2" depth="0.5" color="#ff007f" material="emissive: #ff007f; emissiveIntensity: 0.8"></a-box>
    </a-entity>

    <!-- PLAYER CHARACTER -->
    <a-entity id="player" class="grabbable" position="0 -1.75 0">
      <a-cone radius-bottom="0.5" radius-top="0.05" height="1.2" color="#00ffff" material="emissive: #00ffff; emissiveIntensity: 0.7; roughness: 0.2">
        <a-sphere radius="0.22" position="0 0.2 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 1"></a-sphere>
        <a-light type="point" color="#00ffff" intensity="3" distance="3" position="0 -0.2 0"></a-light>
      </a-cone>
      <!-- Invisible enlarged collider box for easy grabbing in VR -->
      <a-box position="0 0 0" width="1.5" height="1.8" depth="1.5" visible="false"></a-box>
    </a-entity>
  </a-scene>

  <script>
    // --- WEB AUDIO SYNTHESIZER ---
    const audio = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playMoveSound() {
        if (!this.ctx || this.ctx.state !== 'running') return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.03);
        } catch(e) {}
      },
      playHitSound() {
        if (!this.ctx || this.ctx.state !== 'running') return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch(e) {}
      }
    };

    // --- GAME CONSTANTS & STATE ---
    const BOUNDS_X = 4.5;
    const PLAYER_SPEED = 12.0;

    const SPHERE_COLORS = [
      '#ff007f', // Pink
      '#00ffff', // Cyan
      '#9d00ff', // Purple
      '#ffee00', // Yellow
      '#ff3300', // Neon Red
      '#00ff66'  // Green
    ];

    let active = false;
    let lastTime = performance.now();
    let playerX = 0;
    let score = 0;
    let survivalTimer = 0;
    let spawnTimer = 0;
    let spawnInterval = 1.0;
    let obstacles = [];
    let isFallbackMode = false;

    // VR Controller State
    let activeVrController = null;

    // Control inputs
    const keys = { KeyA: false, KeyD: false, ArrowLeft: false, ArrowRight: false };
    let touchLeft = false;
    let touchRight = false;

    // DOM References
    const playerEl = document.getElementById('player');
    const obstacleContainer = document.getElementById('obstacle-container');
    const startOverlay = document.getElementById('start-overlay');
    const overlaySubtitle = document.getElementById('overlay-subtitle');
    const scoreDisplay = document.getElementById('score-display');
    const finalTimeEl = document.getElementById('final-time');
    const hudScoreEl = document.getElementById('hud-score');
    const hudTimerEl = document.getElementById('hud-timer');
    const startBtn = document.getElementById('start-btn');
    const statusValEl = document.getElementById('status-val');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const fallbackCanvas = document.getElementById('fallback-canvas');
    const ctx2d = fallbackCanvas.getContext('2d');

    // Time Formatter (MM:SS.ms)
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 10);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${ms}`;
    }

    // Input Events
    window.addEventListener('keydown', (e) => {
      if (e.code in keys) keys[e.code] = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code in keys) keys[e.code] = false;
    });

    const setupTouchBtn = (btn, setTouch) => {
      const start = (e) => { e.preventDefault(); setTouch(true); audio.init(); };
      const end = (e) => { e.preventDefault(); setTouch(false); };
      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', end);
      btn.addEventListener('mousedown', () => { setTouch(true); audio.init(); });
      btn.addEventListener('mouseup', () => { setTouch(false); });
      btn.addEventListener('mouseleave', () => { setTouch(false); });
    };

    setupTouchBtn(btnLeft, (v) => touchLeft = v);
    setupTouchBtn(btnRight, (v) => touchRight = v);

    // Setup VR Controller Interaction
    function setupVRController(controllerEl) {
      if (!controllerEl) return;
      const grabStart = () => {
        audio.init();
        if (!active) return;
        activeVrController = controllerEl;
      };

      const grabEnd = () => {
        if (activeVrController === controllerEl) {
          activeVrController = null;
        }
      };

      controllerEl.addEventListener('triggerdown', grabStart);
      controllerEl.addEventListener('triggerup', grabEnd);
      controllerEl.addEventListener('gripdown', grabStart);
      controllerEl.addEventListener('gripup', grabEnd);
    }

    setupVRController(document.getElementById('left-hand'));
    setupVRController(document.getElementById('right-hand'));

    function resetGame() {
      // Clear 3D obstacles
      obstacles.forEach(obs => {
        if (obs.el && obs.el.parentNode) {
          obs.el.parentNode.removeChild(obs.el);
        }
      });
      obstacles = [];
      playerX = 0;
      score = 0;
      survivalTimer = 0;
      spawnTimer = 0;
      spawnInterval = 1.0;
      activeVrController = null;

      hudScoreEl.textContent = "0";
      hudTimerEl.textContent = "00:00.0";

      if (playerEl) {
        playerEl.setAttribute('position', '0 -1.75 0');
      }
    }

    // Reliable Start Game Trigger
    startBtn.addEventListener('click', () => {
      audio.init();
      resetGame();
      startOverlay.classList.add('hidden');
      statusValEl.textContent = 'ACTIVE';
      active = true;
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    });

    function spawnObstacle() {
      const spawnX = (Math.random() - 0.5) * (BOUNDS_X * 2);
      const speed = 5.0 + Math.random() * 3.0 + Math.min(score * 0.05, 6.0);
      const radius = 0.35 + Math.random() * 0.2;
      const spawnY = 5.2;
      const color = SPHERE_COLORS[Math.floor(Math.random() * SPHERE_COLORS.length)];

      let el = null;
      if (!isFallbackMode && obstacleContainer && obstacleContainer.sceneEl) {
        el = document.createElement('a-sphere');
        el.setAttribute('radius', radius);
        el.setAttribute('color', color);
        el.setAttribute('material', `emissive: ${color}; emissiveIntensity: 0.8`);
        el.setAttribute('position', `${spawnX} ${spawnY} 0`);
        obstacleContainer.appendChild(el);
      }

      obstacles.push({
        x: spawnX,
        y: spawnY,
        speed: speed,
        radius: radius,
        color: color,
        el: el
      });
    }

    function gameOver() {
      audio.playHitSound();
      active = false;
      statusValEl.textContent = 'GAME OVER';
      overlaySubtitle.textContent = `Collision detected! You survived ${survivalTimer.toFixed(1)}s and reached ${Math.floor(score)} points.`;
      scoreDisplay.textContent = Math.floor(score);
      finalTimeEl.textContent = formatTime(survivalTimer);
      startBtn.textContent = 'RESTART GAME';
      startOverlay.classList.remove('hidden');
    }

    // 2D Fallback renderer
    function drawFallbackFrame() {
      if (!isFallbackMode) return;
      fallbackCanvas.style.display = 'block';

      const w = fallbackCanvas.width = window.innerWidth;
      const h = fallbackCanvas.height = window.innerHeight;

      ctx2d.fillStyle = '#08041d';
      ctx2d.fillRect(0, 0, w, h);

      const platY = h * 0.75;
      const platW = w * 0.7;
      const platX = (w - platW) / 2;

      ctx2d.fillStyle = '#1a0c3b';
      ctx2d.fillRect(platX, platY, platW, 40);

      const normX = (playerX + BOUNDS_X) / (BOUNDS_X * 2);
      const playerPixelX = platX + normX * platW;
      const playerPixelY = platY - 5;

      ctx2d.fillStyle = '#00ffff';
      ctx2d.beginPath();
      ctx2d.moveTo(playerPixelX, playerPixelY - 35);
      ctx2d.lineTo(playerPixelX - 18, playerPixelY);
      ctx2d.lineTo(playerPixelX + 18, playerPixelY);
      ctx2d.closePath();
      ctx2d.fill();

      obstacles.forEach(obs => {
        const normObsX = (obs.x + BOUNDS_X) / (BOUNDS_X * 2);
        const obsPixelX = platX + normObsX * platW;
        const normObsY = (5.2 - obs.y) / 7.2;
        const obsPixelY = (platY - 220) + normObsY * 220;

        ctx2d.fillStyle = obs.color;
        ctx2d.beginPath();
        ctx2d.arc(obsPixelX, obsPixelY, obs.radius * 25, 0, Math.PI * 2);
        ctx2d.fill();
      });
    }

    // Main Game Loop
    function gameLoop(time) {
      if (!active) return;

      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      let moveDir = 0;

      // VR Drag Control
      if (activeVrController && activeVrController.object3D) {
        const worldPos = new THREE.Vector3();
        activeVrController.object3D.getWorldPosition(worldPos);
        const targetX = Math.max(-BOUNDS_X, Math.min(BOUNDS_X, worldPos.x));
        if (Math.abs(targetX - playerX) > 0.05) {
          audio.playMoveSound();
        }
        playerX = targetX;
      } else {
        // Keyboard & Touch Controls
        if (keys.KeyA || keys.ArrowLeft || touchLeft) moveDir -= 1;
        if (keys.KeyD || keys.ArrowRight || touchRight) moveDir += 1;

        if (moveDir !== 0) {
          playerX += moveDir * PLAYER_SPEED * dt;
          playerX = Math.max(-BOUNDS_X, Math.min(BOUNDS_X, playerX));
          audio.playMoveSound();
        }
      }

      if (playerEl) {
        playerEl.setAttribute('position', `${playerX} -1.75 0`);
        playerEl.setAttribute('rotation', `0 0 ${-moveDir * 15}`);
      }

      survivalTimer += dt;
      score += dt * 15;

      hudTimerEl.textContent = formatTime(survivalTimer);
      hudScoreEl.textContent = Math.floor(score).toString();

      spawnTimer += dt;
      spawnInterval = Math.max(0.25, 1.0 - survivalTimer * 0.015);

      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnObstacle();
      }

      const playerY = -1.75;
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y -= obs.speed * dt;

        if (obs.el) {
          obs.el.setAttribute('position', `${obs.x} ${obs.y} 0`);
        }

        const dx = playerX - obs.x;
        const dy = playerY - obs.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < obs.radius + 0.45) {
          gameOver();
          return;
        }

        if (obs.y < -2.2) {
          if (obs.el && obs.el.parentNode) {
            obs.el.parentNode.removeChild(obs.el);
          }
          obstacles.splice(i, 1);
        }
      }

      drawFallbackFrame();
      requestAnimationFrame(gameLoop);
    }

    // Check scene initialization & fallback setup
    const sceneEl = document.querySelector('a-scene');
    if (sceneEl) {
      sceneEl.addEventListener('render-error', () => {
        isFallbackMode = true;
      });
    }
  </script>
</body>
</html>
