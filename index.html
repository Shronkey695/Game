<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Synthwave Dodge: Arcade Survival</title>
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Tailwind CSS for UI Overlay -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #050312;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
    }

    .glow-text-cyan {
      text-shadow: 0 0 8px #00ffff, 0 0 20px #00ffff;
    }

    .glow-text-pink {
      text-shadow: 0 0 8px #ff007f, 0 0 20px #ff007f;
    }

    .glow-box-pink {
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .glow-box-cyan {
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(0, 255, 255, 0.4);
    }

    .a-enter-vr, .a-enter-ar {
      display: none !important;
    }

    /* Force canvas to fill viewport reliably */
    a-scene, canvas.fallback-canvas {
      width: 100vw !important;
      height: 100vh !important;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    canvas.fallback-canvas {
      z-index: 0;
    }
  </style>
</head>
<body class="bg-black text-white">

  <!-- HUD & UI OVERLAY CONTAINER -->
  <div id="ui-container" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4 sm:p-6">
    
    <!-- TOP BAR -->
    <div class="flex justify-between items-center w-full max-w-4xl mx-auto">
      <div class="bg-slate-900/90 backdrop-blur-md border border-cyan-500/50 rounded-xl px-4 py-2 flex items-center gap-3 glow-box-cyan">
        <span class="text-xs text-cyan-400 font-bold uppercase tracking-wider">Status</span>
        <span id="status-val" class="text-sm sm:text-base font-bold text-cyan-300 font-pixel">READY</span>
      </div>

      <div class="bg-slate-900/90 backdrop-blur-md border border-pink-500/50 rounded-xl px-4 py-2 flex items-center gap-3 glow-box-pink">
        <span class="text-xs text-pink-400 font-bold uppercase tracking-wider">Controls</span>
        <span class="text-xs font-bold text-pink-300 font-pixel">A / D KEYS</span>
      </div>
    </div>

    <!-- TOUCH CONTROLS FOR MOBILE DEVICES -->
    <div class="sm:hidden pointer-events-auto flex justify-between w-full max-w-xs mx-auto mb-4 gap-6">
      <button id="btn-left" class="flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 active:from-cyan-400 active:to-blue-400 text-white font-bold py-5 rounded-2xl border-2 border-cyan-300 text-2xl shadow-lg active:scale-95 transition-all text-center select-none">
        &#9664; A
      </button>
      <button id="btn-right" class="flex-1 bg-gradient-to-r from-pink-600 to-purple-600 active:from-pink-400 active:to-purple-400 text-white font-bold py-5 rounded-2xl border-2 border-pink-300 text-2xl shadow-lg active:scale-95 transition-all text-center select-none">
        D &#9654;
      </button>
    </div>

    <!-- INSTRUCTION OVERLAY -->
    <div id="start-overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md pointer-events-auto flex flex-col items-center justify-center text-center p-6 z-20">
      <h1 class="text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 mb-2 glow-text-pink">
        CYBER DODGE
      </h1>
      <p id="overlay-subtitle" class="text-cyan-300 text-sm sm:text-base mb-6 max-w-md tracking-wide">
        Dodge the falling obstacles from the sky!
      </p>

      <div class="bg-slate-900/90 border border-slate-700 rounded-xl p-6 mb-6 max-w-md w-full shadow-2xl text-left space-y-3">
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Move Left:</span>
          <span class="px-2.5 py-1 bg-slate-800 border border-cyan-400 rounded text-cyan-300 font-mono font-bold">A / Left Arrow</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Move Right:</span>
          <span class="px-2.5 py-1 bg-slate-800 border border-pink-400 rounded text-pink-300 font-mono font-bold">D / Right Arrow</span>
        </div>
        <div class="flex items-center justify-between text-sm pt-2 border-t border-slate-800">
          <span class="text-gray-400">Current Score:</span>
          <span id="score-display" class="text-yellow-400 font-mono font-bold">0</span>
        </div>
      </div>

      <button id="start-btn" class="pointer-events-auto px-8 py-4 bg-gradient-to-r from-cyan-500 via-pink-500 to-purple-600 hover:from-cyan-400 hover:to-pink-400 text-white font-black text-xl rounded-full shadow-xl glow-box-pink transform hover:scale-105 active:scale-95 transition-all">
        START GAME
      </button>
    </div>

  </div>

  <!-- FALLBACK CANVAS FOR DIRECT RENDER IF WEBGL/AFRAME Context Fails -->
  <canvas id="fallback-canvas" class="fallback-canvas"></canvas>

  <!-- A-FRAME 3D SCENE -->
  <a-scene id="main-scene" embedded vr-mode-ui="enabled: false">
    <!-- FIXED CAMERA FRAME -->
    <a-entity id="camera-rig" position="0 0 10">
      <a-camera id="main-camera" look-controls="enabled: false" wasd-controls="enabled: false" fov="50"></a-camera>
    </a-entity>

    <!-- LIGHTING -->
    <a-ambient-light color="#ffffff" intensity="1.5"></a-ambient-light>
    <a-directional-light color="#00ffff" intensity="1.0" position="-5 10 5"></a-directional-light>

    <!-- SYNTHWAVE SKY BACKGROUND -->
    <a-sky color="#08041d"></a-sky>

    <!-- CONTAINER FOR DYNAMIC OBSTACLES -->
    <a-entity id="obstacle-container"></a-entity>

    <!-- MAIN PLATFORM (FLOOR WHERE PLAYER MOVES) -->
    <a-entity id="platform-group" position="0 -2.5 0">
      <!-- Top Neon Glowing Rail -->
      <a-box position="0 0.5 0" width="14" height="0.15" depth="0.5" color="#00ffff" material="emissive: #00ffff; emissiveIntensity: 0.9"></a-box>
      <!-- Platform Base -->
      <a-box id="platform-mesh" position="0 -0.5 0" width="14" height="1" depth="2" color="#1a0c3b"></a-box>
      <!-- Left & Right Boundary Pillars -->
      <a-box position="-6.5 1 0" width="0.3" height="2" depth="0.5" color="#ff007f" material="emissive: #ff007f; emissiveIntensity: 0.8"></a-box>
      <a-box position="6.5 1 0" width="0.3" height="2" depth="0.5" color="#ff007f" material="emissive: #ff007f; emissiveIntensity: 0.8"></a-box>
    </a-entity>

    <!-- PLAYER CHARACTER -->
    <a-entity id="player" position="0 -1.75 0">
      <a-cone radius-bottom="0.5" radius-top="0.05" height="1.2" color="#00ffff" material="emissive: #00ffff; emissiveIntensity: 0.7; roughness: 0.2">
        <a-sphere radius="0.22" position="0 0.2 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 1"></a-sphere>
        <a-light type="point" color="#00ffff" intensity="3" distance="3" position="0 -0.2 0"></a-light>
      </a-cone>
    </a-entity>
  </a-scene>

  <script>
    // --- WEB AUDIO SYNTHESIZER ---
    const audio = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playMoveSound() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.03);
        } catch(e) {}
      },
      playHitSound() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch(e) {}
      }
    };

    // --- GAME CONSTANTS & STATE ---
    const BOUNDS_X = 6.0;
    const PLAYER_SPEED = 12.0;

    let active = false;
    let lastTime = performance.now();
    let playerX = 0;
    let score = 0;
    let spawnTimer = 0;
    let spawnInterval = 1.0;
    let obstacles = [];

    // Control inputs
    const keys = { KeyA: false, KeyD: false, ArrowLeft: false, ArrowRight: false };
    let touchLeft = false;
    let touchRight = false;

    // Entity & DOM References
    const playerEl = document.getElementById('player');
    const obstacleContainer = document.getElementById('obstacle-container');
    const startOverlay = document.getElementById('start-overlay');
    const overlaySubtitle = document.getElementById('overlay-subtitle');
    const scoreDisplay = document.getElementById('score-display');
    const startBtn = document.getElementById('start-btn');
    const statusValEl = document.getElementById('status-val');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const fallbackCanvas = document.getElementById('fallback-canvas');
    const ctx2d = fallbackCanvas.getContext('2d');

    // Resize fallback canvas
    function resizeFallbackCanvas() {
      fallbackCanvas.width = window.innerWidth;
      fallbackCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeFallbackCanvas);
    resizeFallbackCanvas();

    // --- INPUT EVENT LISTENERS ---
    window.addEventListener('keydown', (e) => {
      if (e.code in keys) {
        keys[e.code] = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code in keys) {
        keys[e.code] = false;
      }
    });

    const setupTouchBtn = (btn, setTouch) => {
      const start = (e) => { e.preventDefault(); setTouch(true); audio.init(); };
      const end = (e) => { e.preventDefault(); setTouch(false); };
      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', end);
      btn.addEventListener('mousedown', () => { setTouch(true); audio.init(); });
      btn.addEventListener('mouseup', () => { setTouch(false); });
      btn.addEventListener('mouseleave', () => { setTouch(false); });
    };

    setupTouchBtn(btnLeft, (v) => touchLeft = v);
    setupTouchBtn(btnRight, (v) => touchRight = v);

    function resetGame() {
      // Clear obstacles
      obstacles.forEach(obs => {
        if (obs.el && obs.el.parentNode) {
          obs.el.parentNode.removeChild(obs.el);
        }
      });
      obstacles = [];
      playerX = 0;
      score = 0;
      spawnTimer = 0;
      spawnInterval = 1.0;
      if (playerEl) {
        playerEl.setAttribute('position', '0 -1.75 0');
      }
    }

    startBtn.addEventListener('click', () => {
      audio.init();
      resetGame();
      startOverlay.classList.add('hidden');
      statusValEl.textContent = 'ACTIVE';
      active = true;
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    });

    function spawnObstacle() {
      const spawnX = (Math.random() - 0.5) * (BOUNDS_X * 2);
      const speed = 5.0 + Math.random() * 3.0 + Math.min(score * 0.1, 5.0);
      const radius = 0.4 + Math.random() * 0.2;
      const spawnY = 6.0;

      let el = null;
      if (obstacleContainer && obstacleContainer.sceneEl) {
        el = document.createElement('a-sphere');
        el.setAttribute('radius', radius);
        el.setAttribute('color', '#ff007f');
        el.setAttribute('material', 'emissive: #ff007f; emissiveIntensity: 0.8');
        el.setAttribute('position', `${spawnX} ${spawnY} 0`);
        obstacleContainer.appendChild(el);
      }

      obstacles.push({
        x: spawnX,
        y: spawnY,
        speed: speed,
        radius: radius,
        el: el
      });
    }

    function gameOver() {
      audio.playHitSound();
      active = false;
      statusValEl.textContent = 'GAME OVER';
      overlaySubtitle.textContent = `Game Over! You dodged long enough to score ${Math.floor(score)} points.`;
      scoreDisplay.textContent = Math.floor(score);
      startBtn.textContent = 'RESTART GAME';
      startOverlay.classList.remove('hidden');
    }

    // --- STREAMING_CHUNK:Implementing rendering loop... ---
    // Render 2D Fallback frame (guarantees visuals even if WebGL fails)
    function drawFallbackFrame() {
      const w = fallbackCanvas.width;
      const h = fallbackCanvas.height;

      // Background
      ctx2d.fillStyle = '#08041d';
      ctx2d.fillRect(0, 0, w, h);

      // Grid Lines
      ctx2d.strokeStyle = 'rgba(255, 0, 127, 0.2)';
      ctx2d.lineWidth = 1;
      for (let x = 0; x < w; x += 40) {
        ctx2d.beginPath();
        ctx2d.moveTo(x, 0);
        ctx2d.lineTo(x, h);
        ctx2d.stroke();
      }

      // Platform
      const platY = h * 0.75;
      const platW = w * 0.8;
      const platX = (w - platW) / 2;

      ctx2d.fillStyle = '#1a0c3b';
      ctx2d.fillRect(platX, platY, platW, 40);

      // Neon Platform Rail
      ctx2d.fillStyle = '#00ffff';
      ctx2d.shadowColor = '#00ffff';
      ctx2d.shadowBlur = 10;
      ctx2d.fillRect(platX, platY - 4, platW, 8);

      // Side Pillars
      ctx2d.fillStyle = '#ff007f';
      ctx2d.shadowColor = '#ff007f';
      ctx2d.fillRect(platX - 10, platY - 60, 15, 100);
      ctx2d.fillRect(platX + platW - 5, platY - 60, 15, 100);

      // Map player position (-6 to +6) to canvas pixel width
      const normX = (playerX + BOUNDS_X) / (BOUNDS_X * 2);
      const playerPixelX = platX + normX * platW;
      const playerPixelY = platY - 5;

      // Draw Player Triangle
      ctx2d.fillStyle = '#00ffff';
      ctx2d.shadowColor = '#00ffff';
      ctx2d.shadowBlur = 15;
      ctx2d.beginPath();
      ctx2d.moveTo(playerPixelX, playerPixelY - 40);
      ctx2d.lineTo(playerPixelX - 20, playerPixelY);
      ctx2d.lineTo(playerPixelX + 20, playerPixelY);
      ctx2d.closePath();
      ctx2d.fill();

      // Core sphere
      ctx2d.fillStyle = '#ffffff';
      ctx2d.beginPath();
      ctx2d.arc(playerPixelX, playerPixelY - 20, 8, 0, Math.PI * 2);
      ctx2d.fill();

      // Draw Falling Obstacles
      obstacles.forEach(obs => {
        const normObsX = (obs.x + BOUNDS_X) / (BOUNDS_X * 2);
        const obsPixelX = platX + normObsX * platW;
        // Map y from world space (top=6, bottom=-2.5) to screen space
        const normObsY = (6.0 - obs.y) / 8.5;
        const obsPixelY = (platY - 200) + normObsY * 200;

        ctx2d.fillStyle = '#ff007f';
        ctx2d.shadowColor = '#ff007f';
        ctx2d.shadowBlur = 12;
        ctx2d.beginPath();
        ctx2d.arc(obsPixelX, obsPixelY, obs.radius * 25, 0, Math.PI * 2);
        ctx2d.fill();
      });

      ctx2d.shadowBlur = 0;
    }

    // --- MAIN TICK LOOP ---
    function gameLoop(time) {
      if (!active) return;

      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      // Player Movement Logic
      let moveDir = 0;
      if (keys.KeyA || keys.ArrowLeft || touchLeft) moveDir -= 1;
      if (keys.KeyD || keys.ArrowRight || touchRight) moveDir += 1;

      if (moveDir !== 0) {
        playerX += moveDir * PLAYER_SPEED * dt;
        playerX = Math.max(-BOUNDS_X, Math.min(BOUNDS_X, playerX));
        
        // Update A-Frame Entity position if loaded
        if (playerEl) {
          playerEl.setAttribute('position', `${playerX} -1.75 0`);
          playerEl.setAttribute('rotation', `0 0 ${-moveDir * 15}`);
        }
        audio.playMoveSound();
      } else if (playerEl) {
        playerEl.setAttribute('rotation', '0 0 0');
      }

      // Score Accumulation & Obstacle Spawning
      score += dt * 10;
      spawnTimer += dt;
      spawnInterval = Math.max(0.3, 1.0 - score * 0.005);

      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnObstacle();
      }

      // Update Falling Obstacles & Check Collisions
      const playerY = -1.75;
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y -= obs.speed * dt;

        if (obs.el) {
          obs.el.setAttribute('position', `${obs.x} ${obs.y} 0`);
        }

        // Collision Check
        const dx = playerX - obs.x;
        const dy = playerY - obs.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < obs.radius + 0.45) {
          gameOver();
          return;
        }

        // Remove obstacles that fall past the platform
        if (obs.y < -3.5) {
          if (obs.el && obs.el.parentNode) {
            obs.el.parentNode.removeChild(obs.el);
          }
          obstacles.splice(i, 1);
        }
      }

      // Render 2D fallback continuously
      drawFallbackFrame();

      requestAnimationFrame(gameLoop);
    }

    // Initial background draw before game starts
    drawFallbackFrame();
  </script>
</body>
</html>
