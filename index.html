<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Synthwave Dodge: Arcade Survival VR</title>
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Tailwind CSS for 2D UI Overlay -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    // =========================================================================
    // A-FRAME CUSTOM COMPONENTS (REGISTERED BEFORE SCENE INITIALIZATION)
    // =========================================================================

    // Dynamic 3D Curved/Flat Text Update Helper
    AFRAME.registerComponent('vr-hud-updater', {
      schema: { type: 'string', default: '' },
      update: function () {
        this.el.setAttribute('text', 'value', this.data);
      }
    });

    // VR Thumbstick & Trigger Direct Steer Component
    AFRAME.registerComponent('vr-grab-steer', {
      init: function () {
        this.isGrabbing = false;
        this.thumbstickX = 0;

        // Trigger / Grip listeners for hand grab dragging
        const onGrabStart = () => {
          if (window.audio) window.audio.init();
          if (window.gameState && window.gameState.active) {
            this.isGrabbing = true;
          }
        };

        const onGrabEnd = () => {
          this.isGrabbing = false;
        };

        this.el.addEventListener('triggerdown', onGrabStart);
        this.el.addEventListener('triggerup', onGrabEnd);
        this.el.addEventListener('gripdown', onGrabStart);
        this.el.addEventListener('gripup', onGrabEnd);

        // Thumbstick / Axis Move listener for stick steering in VR
        this.el.addEventListener('axismove', (e) => {
          // Axis 0 is typically horizontal thumbstick / trackpad
          if (e.detail.axis && e.detail.axis.length >= 2) {
            const axisX = e.detail.axis[0] || e.detail.axis[2] || 0;
            if (Math.abs(axisX) > 0.15) {
              this.thumbstickX = axisX;
            } else {
              this.thumbstickX = 0;
            }
          }
        });
      },
      tick: function (time, timeDelta) {
        if (!window.gameState || !window.gameState.active) return;

        const dt = Math.min(timeDelta / 1000, 0.1);

        // 1. Hand Position Direct Grab Steering
        if (this.isGrabbing) {
          const worldPos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(worldPos);
          const targetX = Math.max(-window.BOUNDS_X, Math.min(window.BOUNDS_X, worldPos.x));
          if (Math.abs(targetX - window.gameState.playerX) > 0.05) {
            if (window.audio) window.audio.playMoveSound();
          }
          window.gameState.playerX = targetX;
        }

        // 2. Thumbstick Steering
        if (Math.abs(this.thumbstickX) > 0.15 && !this.isGrabbing) {
          const moveDelta = this.thumbstickX * window.PLAYER_SPEED * dt;
          window.gameState.playerX = Math.max(-window.BOUNDS_X, Math.min(window.BOUNDS_X, window.gameState.playerX + moveDelta));
          if (window.audio) window.audio.playMoveSound();
        }
      }
    });

    // VR 3D Button Interactivity Component
    AFRAME.registerComponent('vr-button-click', {
      init: function () {
        const el = this.el;
        el.addEventListener('mouseenter', () => {
          el.setAttribute('scale', '1.1 1.1 1.1');
        });
        el.addEventListener('mouseleave', () => {
          el.setAttribute('scale', '1 1 1');
        });
        el.addEventListener('click', () => {
          if (window.audio) window.audio.init();
          if (window.startOrRestartGame) {
            window.startOrRestartGame();
          }
        });
      }
    });
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

    * {
      box-sizing: border-box;
      touch-action: none; /* Prevent browser scrolling during screen drag controls */
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #050312;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
    }

    .glow-text-cyan {
      text-shadow: 0 0 8px #00ffff, 0 0 20px #00ffff;
    }

    .glow-text-pink {
      text-shadow: 0 0 8px #ff007f, 0 0 20px #ff007f;
    }

    .glow-box-pink {
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .glow-box-cyan {
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(0, 255, 255, 0.4);
    }

    .glow-box-yellow {
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.6), inset 0 0 15px rgba(234, 179, 8, 0.4);
    }

    /* Style A-Frame VR Button */
    .a-enter-vr {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 50 !important;
    }

    /* Scene layout */
    a-scene {
      width: 100vw !important;
      height: 100vh !important;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    canvas.fallback-canvas {
      width: 100vw !important;
      height: 100vh !important;
      display: none; /* Visible if WebGL fails */
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
  </style>
</head>
<body class="bg-black text-white">

  <!-- HUD & UI OVERLAY CONTAINER (FOR 2D FLAT SCREEN MODE) -->
  <div id="ui-container" class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-2 sm:p-6 transition-opacity duration-300">
    
    <!-- TOP BAR HUD WITH TIMER, LIVE SCORE & CONTROLS -->
    <div class="flex flex-row items-center justify-between w-full max-w-6xl mx-auto px-1 sm:px-2 gap-1 sm:gap-3 flex-nowrap">
      
      <!-- STATUS DISPLAY -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-cyan-500/50 rounded-lg sm:rounded-xl px-2 py-1 sm:px-3 sm:py-1.5 flex items-center gap-1.5 sm:gap-2 glow-box-cyan whitespace-nowrap min-w-0">
        <span class="text-[9px] sm:text-xs text-cyan-400 font-bold uppercase tracking-wider">Status</span>
        <span id="status-val" class="text-[10px] sm:text-xs font-bold text-cyan-300 font-pixel truncate">READY</span>
      </div>

      <!-- TIMER DISPLAY -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-yellow-500/50 rounded-lg sm:rounded-xl px-2 py-1 sm:px-3 sm:py-1.5 flex items-center gap-1.5 sm:gap-2 glow-box-yellow whitespace-nowrap min-w-0">
        <span class="text-[9px] sm:text-xs text-yellow-400 font-bold uppercase tracking-wider">Time</span>
        <span id="hud-timer" class="text-[10px] sm:text-xs font-bold text-yellow-300 font-pixel truncate">00:00.0</span>
      </div>

      <!-- LIVE SCORE DISPLAY -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-pink-500/50 rounded-lg sm:rounded-xl px-2 py-1 sm:px-3 sm:py-1.5 flex items-center gap-1.5 sm:gap-2 glow-box-pink whitespace-nowrap min-w-0">
        <span class="text-[9px] sm:text-xs text-pink-400 font-bold uppercase tracking-wider">Score</span>
        <span id="hud-score" class="text-[10px] sm:text-xs font-bold text-pink-300 font-pixel truncate">0</span>
      </div>

      <!-- CONTROLS HINT DISPLAY -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-pink-500/50 rounded-lg sm:rounded-xl px-2 py-1 sm:px-3 sm:py-1.5 flex items-center gap-1.5 sm:gap-2 glow-box-pink whitespace-nowrap min-w-0">
        <span class="text-[9px] sm:text-xs text-pink-400 font-bold uppercase tracking-wider hidden xs:inline">Controls</span>
        <span class="text-[9px] sm:text-xs font-bold text-pink-300 font-pixel truncate">DRAG / A-D</span>
      </div>
    </div>

    <!-- TOUCH BUTTON CONTROLS FOR MOBILE DEVICES -->
    <div class="sm:hidden pointer-events-auto flex justify-between w-full max-w-xs mx-auto mb-4 gap-6 z-20">
      <button id="btn-left" class="flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 active:from-cyan-400 active:to-blue-400 text-white font-bold py-5 rounded-2xl border-2 border-cyan-300 text-2xl shadow-lg active:scale-95 transition-all text-center select-none">
        &#9664; A
      </button>
      <button id="btn-right" class="flex-1 bg-gradient-to-r from-pink-600 to-purple-600 active:from-pink-400 active:to-purple-400 text-white font-bold py-5 rounded-2xl border-2 border-pink-300 text-2xl shadow-lg active:scale-95 transition-all text-center select-none">
        D &#9654;
      </button>
    </div>

    <!-- INSTRUCTION / GAME OVER OVERLAY -->
    <div id="start-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md pointer-events-auto flex flex-col items-center justify-center text-center p-6 z-30">
      <h1 class="text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 mb-2 glow-text-pink">
        CYBER DODGE
      </h1>
      <p id="overlay-subtitle" class="text-cyan-300 text-sm sm:text-base mb-6 max-w-md tracking-wide">
        Dodge the falling plasma orbs from above!
      </p>

      <div class="bg-slate-900/90 border border-slate-700 rounded-xl p-5 sm:p-6 mb-6 max-w-md w-full shadow-2xl text-left space-y-3">
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Touch/Mouse:</span>
          <span class="px-2.5 py-1 bg-slate-800 border border-cyan-400 rounded text-cyan-300 font-mono font-bold">Hold & Drag Screen</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Keyboard:</span>
          <span class="px-2.5 py-1 bg-slate-800 border border-pink-400 rounded text-pink-300 font-mono font-bold">A / D / Arrow Keys</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">VR Control:</span>
          <span class="px-2.5 py-1 bg-slate-800 border border-purple-400 rounded text-purple-300 font-mono font-bold">Thumbstick / Drag Ship</span>
        </div>
        <div class="flex items-center justify-between text-sm pt-2 border-t border-slate-800">
          <span class="text-gray-400">Survival Time:</span>
          <span id="final-time" class="text-yellow-400 font-mono font-bold">00:00.0</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Final Score:</span>
          <span id="score-display" class="text-pink-400 font-mono font-bold">0</span>
        </div>
      </div>

      <button id="start-btn" class="pointer-events-auto px-8 py-4 bg-gradient-to-r from-cyan-500 via-pink-500 to-purple-600 hover:from-cyan-400 hover:to-pink-400 text-white font-black text-xl rounded-full shadow-xl glow-box-pink transform hover:scale-105 active:scale-95 transition-all cursor-pointer">
        START GAME
      </button>
    </div>

  </div>

  <!-- FALLBACK CANVAS FOR DIRECT 2D RENDER IF WEBGL FAILS -->
  <canvas id="fallback-canvas" class="fallback-canvas"></canvas>

  <!-- A-FRAME 3D SCENE -->
  <a-scene id="main-scene" embedded vr-mode-ui="enabled: true">
    
    <!-- CAMERA RIG WITH VR CONTROLLERS & Spatial 3D HUD -->
    <a-entity id="camera-rig" position="0 0 10">
      
      <!-- MAIN CAMERA WITH INVISIBLE CURSOR FOR GAZE/CLICK INTERACTION IN VR -->
      <a-camera id="main-camera" look-controls="enabled: true" wasd-controls="enabled: false" fov="50">
        <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable, .grabbable"></a-entity>
      </a-camera>

      <!-- LEFT VR CONTROLLER -->
      <a-entity id="left-hand" 
                laser-controls="hand: left" 
                raycaster="objects: .clickable, .grabbable; far: 25"
                oculus-touch-controls="hand: left"
                vive-controls="hand: left"
                vr-grab-steer>
      </a-entity>

      <!-- RIGHT VR CONTROLLER -->
      <a-entity id="right-hand" 
                laser-controls="hand: right" 
                raycaster="objects: .clickable, .grabbable; far: 25"
                oculus-touch-controls="hand: right"
                vive-controls="hand: right"
                vr-grab-steer>
      </a-entity>

      <!-- IN-VR SPATIAL 3D HUD PANEL (CLEAN NO-BACKGROUND TEXT FOR HYPER CLEAR VIEW) -->
      <a-entity id="vr-hud-panel" position="0 2.2 -3.5" rotation="10 0 0">
        <!-- Live VR Status Text -->
        <a-entity id="vr-status-text" position="-1.2 0.12 0.02" text="value: STATUS: READY; color: #00ffff; width: 3.5; align: left; font: align; bold: true"></a-entity>
        
        <!-- Live VR Score Text -->
        <a-entity id="vr-score-text" position="0.2 0.12 0.02" text="value: SCORE: 0; color: #ff007f; width: 3.5; align: left; font: align; bold: true"></a-entity>
        
        <!-- Live VR Timer Text -->
        <a-entity id="vr-timer-text" position="-1.2 -0.15 0.02" text="value: TIME: 00:00.0; color: #ffee00; width: 3.5; align: left; font: align; bold: true"></a-entity>
      </a-entity>

      <!-- IN-VR 3D START / RESTART BUTTON MENU -->
      <a-entity id="vr-menu-panel" position="0 0.8 -3.0" rotation="-5 0 0">
        <!-- Start/Restart Interactive Button Box -->
        <a-plane id="vr-start-btn" class="clickable" vr-button-click width="1.8" height="0.5" color="#ff007f" material="shader: flat; emissive: #ff007f; emissiveIntensity: 0.5" position="0 0 0">
          <a-text value="START GAME" align="center" position="0 0 0.02" width="4" color="#ffffff" bold="true"></a-text>
        </a-plane>
      </a-entity>

    </a-entity>

    <!-- LIGHTING -->
    <a-ambient-light color="#ffffff" intensity="1.5"></a-ambient-light>
    <a-directional-light color="#00ffff" intensity="1.0" position="-5 10 5"></a-directional-light>

    <!-- SYNTHWAVE SKY BACKGROUND -->
    <a-sky color="#08041d"></a-sky>

    <!-- CONTAINER FOR DYNAMIC OBSTACLES -->
    <a-entity id="obstacle-container"></a-entity>

    <!-- MAIN PLATFORM (FLOOR WHERE PLAYER MOVES) -->
    <a-entity id="platform-group" position="0 -2.5 0">
      <!-- Platform Base -->
      <a-box id="platform-mesh" position="0 -0.5 0" width="12" height="1" depth="2" color="#1a0c3b"></a-box>
      <!-- Left & Right Boundary Pillars -->
      <a-box position="-5.2 1 0" width="0.3" height="2" depth="0.5" color="#ff007f" material="emissive: #ff007f; emissiveIntensity: 0.8"></a-box>
      <a-box position="5.2 1 0" width="0.3" height="2" depth="0.5" color="#ff007f" material="emissive: #ff007f; emissiveIntensity: 0.8"></a-box>
    </a-entity>

    <!-- PLAYER CHARACTER -->
    <a-entity id="player" class="grabbable clickable" position="0 -1.75 0">
      <a-cone radius-bottom="0.5" radius-top="0.05" height="1.2" color="#00ffff" material="emissive: #00ffff; emissiveIntensity: 0.7; roughness: 0.2">
        <a-sphere radius="0.22" position="0 0.2 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 1"></a-sphere>
        <a-light type="point" color="#00ffff" intensity="3" distance="3" position="0 -0.2 0"></a-light>
      </a-cone>
      <!-- Invisible enlarged collider box for easy grabbing in VR -->
      <a-box position="0 0 0" width="1.8" height="2.0" depth="1.8" visible="false"></a-box>
    </a-entity>
  </a-scene>

  <script>
    // --- GLOBAL GAME STATE & CONSTANTS ---
    window.BOUNDS_X = 4.5;
    window.PLAYER_SPEED = 12.0;
    const WIN_TIME = 60; // Target survival time in seconds

    window.gameState = {
      active: false,
      playerX: 0,
      score: 0,
      survivalTimer: 0,
      isVR: false,
      hasWon: false
    };

    let lastTime = performance.now();
    let spawnTimer = 0;
    let spawnInterval = 1.0;
    let obstacles = [];
    let isFallbackMode = false;

    // Control States
    const keys = { KeyA: false, KeyD: false, ArrowLeft: false, ArrowRight: false };
    let touchLeft = false;
    let touchRight = false;
    let isPointerDragging = false;

    // --- WEB AUDIO SYNTHESIZER ---
    window.audio = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playMoveSound() {
        if (!this.ctx || this.ctx.state !== 'running') return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.03);
        } catch(e) {}
      },
      playHitSound() {
        if (!this.ctx || this.ctx.state !== 'running') return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch(e) {}
      },
      playWinSound() {
        if (!this.ctx || this.ctx.state !== 'running') return;
        try {
          // Play a triumphant synth arpeggio chord (C4, E4, G4, C5)
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
          notes.forEach((freq, index) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const startTime = this.ctx.currentTime + index * 0.08;

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startTime);

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.15, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(startTime);
            osc.stop(startTime + 0.4);
          });
        } catch(e) {}
      }
    };

    const SPHERE_COLORS = [
      '#ff007f', // Pink
      '#00ffff', // Cyan
      '#9d00ff', // Purple
      '#ffee00', // Yellow
      '#ff3300', // Neon Red
      '#00ff66'  // Green
    ];

    // DOM & Scene Elements
    const playerEl = document.getElementById('player');
    const obstacleContainer = document.getElementById('obstacle-container');
    const startOverlay = document.getElementById('start-overlay');
    const uiContainer = document.getElementById('ui-container');
    const overlaySubtitle = document.getElementById('overlay-subtitle');
    const scoreDisplay = document.getElementById('score-display');
    const finalTimeEl = document.getElementById('final-time');
    const hudScoreEl = document.getElementById('hud-score');
    const hudTimerEl = document.getElementById('hud-timer');
    const startBtn = document.getElementById('start-btn');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const fallbackCanvas = document.getElementById('fallback-canvas');
    const ctx2d = fallbackCanvas.getContext('2d');

    // 3D VR HUD Elements
    const vrStatusText = document.getElementById('vr-status-text');
    const vrScoreText = document.getElementById('vr-score-text');
    const vrTimerText = document.getElementById('vr-timer-text');
    const vrMenuPanel = document.getElementById('vr-menu-panel');
    const vrStartBtn = document.getElementById('vr-start-btn');

    // Time Formatter (MM:SS.ms)
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 10);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${ms}`;
    }

    // --- KEYBOARD CONTROLS ---
    window.addEventListener('keydown', (e) => {
      if (e.code in keys) keys[e.code] = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code in keys) keys[e.code] = false;
    });

    // --- ON-SCREEN TOUCH BUTTON CONTROLS ---
    const setupTouchBtn = (btn, setTouch) => {
      const start = (e) => { e.stopPropagation(); e.preventDefault(); setTouch(true); window.audio.init(); };
      const end = (e) => { e.stopPropagation(); e.preventDefault(); setTouch(false); };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('mousedown', (e) => { e.stopPropagation(); setTouch(true); window.audio.init(); });
      btn.addEventListener('mouseup', (e) => { e.stopPropagation(); setTouch(false); });
      btn.addEventListener('mouseleave', (e) => { e.stopPropagation(); setTouch(false); });
    };

    setupTouchBtn(btnLeft, (v) => touchLeft = v);
    setupTouchBtn(btnRight, (v) => touchRight = v);

    // --- SCREEN TOUCH & MOUSE DIRECT STEERING / DRAGGING ---
    function updatePositionFromPointer(clientX) {
      if (!window.gameState.active) return;
      const normalizedX = (clientX / window.innerWidth) * 2 - 1; // Map screen width to [-1, +1]
      const targetX = normalizedX * window.BOUNDS_X;
      window.gameState.playerX = Math.max(-window.BOUNDS_X, Math.min(window.BOUNDS_X, targetX));
      window.audio.playMoveSound();
    }

    window.addEventListener('pointerdown', (e) => {
      if (!window.gameState.active || e.target.closest('#start-overlay') || e.target.closest('#btn-left') || e.target.closest('#btn-right')) return;
      isPointerDragging = true;
      window.audio.init();
      updatePositionFromPointer(e.clientX);
    const statusValEl = document.getElementById('status-val');
    const overlayTitle = document.querySelector('#start-overlay h1');

    // Reset Game State
    function resetGame() {
      // Clear 3D obstacles
      obstacles.forEach(obs => {
        if (obs.el && obs.el.parentNode) {
          obs.el.parentNode.removeChild(obs.el);
        }
      });
      obstacles = [];
      window.gameState.playerX = 0;
      window.gameState.score = 0;
      window.gameState.survivalTimer = 0;
      window.gameState.hasWon = false;
      spawnTimer = 0;
      spawnInterval = 1.0;
      isPointerDragging = false;

      statusValEl.textContent = 'READY';
      if (overlayTitle) {
        overlayTitle.textContent = 'CYBER DODGE';
        overlayTitle.className = "text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 mb-2 glow-text-pink";
      }

      hudScoreEl.textContent = "0";
      hudTimerEl.textContent = "00:00.0";

      if (vrStatusText) vrStatusText.setAttribute('text', 'value', 'STATUS: READY');
      if (vrScoreText) vrScoreText.setAttribute('text', 'value', 'SCORE: 0');
      if (vrTimerText) vrTimerText.setAttribute('text', 'value', 'TIME: 00:00.0');

      if (playerEl) {
        playerEl.setAttribute('position', '0 -1.75 0');
      }
    }

    // Global Trigger for Starting or Restarting Game (Works for both 2D and VR)
    window.startOrRestartGame = function () {
      window.audio.init();
      resetGame();
      startOverlay.classList.add('hidden');
      if (vrMenuPanel) vrMenuPanel.setAttribute('visible', 'false');

      statusValEl.textContent = 'ACTIVE';
      if (vrStatusText) vrStatusText.setAttribute('text', 'value', 'STATUS: ACTIVE');

      window.gameState.active = true;
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    };

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.startOrRestartGame();
    });

    function spawnObstacle() {
      const spawnX = (Math.random() - 0.5) * (window.BOUNDS_X * 2);
      const speed = 5.0 + Math.random() * 3.0 + Math.min(window.gameState.score * 0.05, 6.0);
      const radius = 0.35 + Math.random() * 0.2;
      const spawnY = 5.2;
      const color = SPHERE_COLORS[Math.floor(Math.random() * SPHERE_COLORS.length)];

      let el = null;
      if (!isFallbackMode && obstacleContainer && obstacleContainer.sceneEl) {
        el = document.createElement('a-sphere');
        el.setAttribute('radius', radius);
        el.setAttribute('color', color);
        el.setAttribute('material', `emissive: ${color}; emissiveIntensity: 0.8`);
        el.setAttribute('position', `${spawnX} ${spawnY} 0`);
        obstacleContainer.appendChild(el);
      }

      obstacles.push({
        x: spawnX,
        y: spawnY,
        speed: speed,
        radius: radius,
        color: color,
        el: el
      });
    }

    function gameOver() {
      window.audio.playHitSound();
      window.gameState.active = false;
      isPointerDragging = false;

      statusValEl.textContent = 'GAME OVER';
      if (vrStatusText) vrStatusText.setAttribute('text', 'value', 'STATUS: GAME OVER');

      if (overlayTitle) {
        overlayTitle.textContent = 'GAME OVER';
        overlayTitle.className = "text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-pink-500 to-yellow-400 mb-2 glow-text-pink";
      }

      overlaySubtitle.textContent = `Collision detected! You survived ${window.gameState.survivalTimer.toFixed(1)}s and reached ${Math.floor(window.gameState.score)} points.`;
      scoreDisplay.textContent = Math.floor(window.gameState.score);
      finalTimeEl.textContent = formatTime(window.gameState.survivalTimer);

      startBtn.textContent = 'RESTART GAME';
      if (!window.gameState.isVR) {
        startOverlay.classList.remove('hidden');
      }

      if (vrMenuPanel) {
        const vrBtnText = vrStartBtn.querySelector('a-text');
        if (vrBtnText) vrBtnText.setAttribute('value', 'RESTART GAME');
        vrMenuPanel.setAttribute('visible', 'true');
      }
    }

    function winGame() {
      window.audio.playWinSound();
      window.gameState.active = false;
      window.gameState.hasWon = true;
      isPointerDragging = false;

      // Cap survival timer to exactly 60 seconds
      window.gameState.survivalTimer = WIN_TIME;

      statusValEl.textContent = 'VICTORY';
      if (vrStatusText) vrStatusText.setAttribute('text', 'value', 'STATUS: VICTORY!');

      if (overlayTitle) {
        overlayTitle.textContent = 'YOU WIN!';
        overlayTitle.className = "text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-emerald-400 to-cyan-400 mb-2 glow-text-cyan";
      }

      overlaySubtitle.textContent = `VICTORY achieved! You survived the full 60 seconds!`;
      scoreDisplay.textContent = Math.floor(window.gameState.score);
      finalTimeEl.textContent = formatTime(WIN_TIME);

      startBtn.textContent = 'PLAY AGAIN';
      if (!window.gameState.isVR) {
        startOverlay.classList.remove('hidden');
      }

      if (vrMenuPanel) {
        const vrBtnText = vrStartBtn.querySelector('a-text');
        if (vrBtnText) vrBtnText.setAttribute('value', 'PLAY AGAIN');
        vrMenuPanel.setAttribute('visible', 'true');
      }
    }

    // Main Game Loop
    function gameLoop(time) {
      if (!window.gameState.active) return;

      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      let moveDir = 0;

      // Keyboard & Touch Controls (active if pointer isn't dragging)
      if (!isPointerDragging) {
        if (keys.KeyA || keys.ArrowLeft || touchLeft) moveDir -= 1;
        if (keys.KeyD || keys.ArrowRight || touchRight) moveDir += 1;

        if (moveDir !== 0) {
          window.gameState.playerX += moveDir * window.PLAYER_SPEED * dt;
          window.gameState.playerX = Math.max(-window.BOUNDS_X, Math.min(window.BOUNDS_X, window.gameState.playerX));
          window.audio.playMoveSound();
        }
      }

      if (playerEl) {
        playerEl.setAttribute('position', `${window.gameState.playerX} -1.75 0`);
        playerEl.setAttribute('rotation', `0 0 ${-moveDir * 15}`);
      }

      window.gameState.survivalTimer += dt;
      window.gameState.score += dt * 15;

      // CHECK WIN CONDITION (1 minute / 60 seconds)
      if (window.gameState.survivalTimer >= WIN_TIME) {
        winGame();
        return;
      }

      const formattedTime = formatTime(window.gameState.survivalTimer);
      const formattedScore = Math.floor(window.gameState.score).toString();

      // Update 2D HUD
      hudTimerEl.textContent = formattedTime;
      hudScoreEl.textContent = formattedScore;

      // Update VR 3D HUD
      if (vrTimerText) vrTimerText.setAttribute('text', 'value', `TIME: ${formattedTime}`);
      if (vrScoreText) vrScoreText.setAttribute('text', 'value', `SCORE: ${formattedScore}`);

      spawnTimer += dt;
      spawnInterval = Math.max(0.25, 1.0 - window.gameState.survivalTimer * 0.015);

      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnObstacle();
      }

      const playerY = -1.75;
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y -= obs.speed * dt;

        if (obs.el) {
          obs.el.setAttribute('position', `${obs.x} ${obs.y} 0`);
        }

        const dx = window.gameState.playerX - obs.x;
        const dy = playerY - obs.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < obs.radius + 0.45) {
          gameOver();
          return;
        }

        if (obs.y < -2.2) {
          if (obs.el && obs.el.parentNode) {
            obs.el.parentNode.removeChild(obs.el);
          }
          obstacles.splice(i, 1);
        }
      }

      drawFallbackFrame();
      requestAnimationFrame(gameLoop);
    }

    // VR MODE ENTER / EXIT EVENT HANDLERS
    const sceneEl = document.querySelector('a-scene');
    if (sceneEl) {
      sceneEl.addEventListener('enter-vr', () => {
        window.gameState.isVR = true;
        // Hide 2D HTML overlay in VR to avoid obscuring immersive view
        uiContainer.classList.add('opacity-0', 'pointer-events-none');
        if (vrMenuPanel && !window.gameState.active) {
          vrMenuPanel.setAttribute('visible', 'true');
        }
      });

      sceneEl.addEventListener('exit-vr', () => {
        window.gameState.isVR = false;
        // Restore 2D overlay when exiting VR
        uiContainer.classList.remove('opacity-0', 'pointer-events-none');
        if (!window.gameState.active) {
          startOverlay.classList.remove('hidden');
        }
      });

      sceneEl.addEventListener('render-error', () => {
        isFallbackMode = true;
      });
    }
  </script>
</body>
</html>
