<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Synthwave Dodge: VR & Arcade Survival</title>
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Tailwind CSS for UI Overlay -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #050312;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
    }

    .glow-text-cyan {
      text-shadow: 0 0 8px #00ffff, 0 0 20px #00ffff;
    }

    .glow-text-pink {
      text-shadow: 0 0 8px #ff007f, 0 0 20px #ff007f;
    }

    .glow-box-pink {
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .glow-box-cyan {
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(0, 255, 255, 0.4);
    }

    /* Keep VR button styled & visible in bottom right */
    .a-enter-vr {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 50 !important;
    }

    /* Force canvas to fill viewport reliably */
    a-scene, canvas.fallback-canvas {
      width: 100vw !important;
      height: 100vh !important;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    a-scene {
      z-index: 1;
    }

    canvas.fallback-canvas {
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-black text-white">

  <!-- HUD & UI OVERLAY CONTAINER -->
  <div id="ui-container" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4 sm:p-6">
    
    <!-- TOP BAR (HUD) -->
    <div class="flex flex-wrap justify-between items-center w-full max-w-4xl mx-auto gap-2">
      <!-- Status Box -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-cyan-500/50 rounded-xl px-4 py-2 flex items-center gap-3 glow-box-cyan">
        <span class="text-xs text-cyan-400 font-bold uppercase tracking-wider">Status</span>
        <span id="status-val" class="text-xs sm:text-sm font-bold text-cyan-300 font-pixel">READY</span>
      </div>

      <!-- Live Timer Box -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-yellow-500/50 rounded-xl px-4 py-2 flex items-center gap-3 shadow-lg">
        <span class="text-xs text-yellow-400 font-bold uppercase tracking-wider">Time</span>
        <span id="timer-val" class="text-xs sm:text-sm font-bold text-yellow-300 font-pixel">00:00.0</span>
      </div>

      <!-- Live Score Box -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-purple-500/50 rounded-xl px-4 py-2 flex items-center gap-3 shadow-lg">
        <span class="text-xs text-purple-400 font-bold uppercase tracking-wider">Score</span>
        <span id="score-val" class="text-xs sm:text-sm font-bold text-purple-300 font-pixel">0</span>
      </div>

      <!-- Controls Info Box -->
      <div class="bg-slate-900/90 backdrop-blur-md border border-pink-500/50 rounded-xl px-4 py-2 flex items-center gap-3 glow-box-pink">
        <span class="text-xs text-pink-400 font-bold uppercase tracking-wider">Controls</span>
        <span class="text-xs font-bold text-pink-300 font-pixel">A / D / TOUCH / VR</span>
      </div>
    </div>

    <!-- TOUCH CONTROLS FOR MOBILE DEVICES -->
    <div class="sm:hidden pointer-events-auto flex justify-between w-full max-w-xs mx-auto mb-4 gap-6">
      <button id="btn-left" class="flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 active:from-cyan-400 active:to-blue-400 text-white font-bold py-4 rounded-2xl border-2 border-cyan-300 text-xl shadow-lg active:scale-95 transition-all text-center select-none">
        &#9664; A
      </button>
      <button id="btn-right" class="flex-1 bg-gradient-to-r from-pink-600 to-purple-600 active:from-pink-400 active:to-purple-400 text-white font-bold py-4 rounded-2xl border-2 border-pink-300 text-xl shadow-lg active:scale-95 transition-all text-center select-none">
        D &#9654;
      </button>
    </div>

    <!-- INSTRUCTION / START / GAME OVER OVERLAY -->
    <div id="start-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md pointer-events-auto flex flex-col items-center justify-center text-center p-6 z-20">
      <h1 class="text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 mb-2 glow-text-pink">
        CYBER DODGE
      </h1>
      <p id="overlay-subtitle" class="text-cyan-300 text-sm sm:text-base mb-6 max-w-md tracking-wide">
        Dodge the falling neon spheres!
      </p>

      <div class="bg-slate-900/90 border border-slate-700 rounded-xl p-5 mb-6 max-w-md w-full shadow-2xl text-left space-y-3">
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Keyboard:</span>
          <span class="px-2 py-0.5 bg-slate-800 border border-cyan-400 rounded text-cyan-300 font-mono font-bold text-xs">A / D or Arrows</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Screen Touch / Drag:</span>
          <span class="px-2 py-0.5 bg-slate-800 border border-pink-400 rounded text-pink-300 font-mono font-bold text-xs">Hold & Slide Anywhere</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">VR Controllers:</span>
          <span class="px-2 py-0.5 bg-slate-800 border border-yellow-400 rounded text-yellow-300 font-mono font-bold text-xs">Hold Trigger / Grip to Steer</span>
        </div>
        <div class="flex items-center justify-between text-sm pt-2 border-t border-slate-800">
          <span class="text-gray-400">Best Time / Score:</span>
          <span id="score-display" class="text-yellow-400 font-mono font-bold">00:00.0 (0 pts)</span>
        </div>
      </div>

      <button id="start-btn" class="pointer-events-auto px-8 py-4 bg-gradient-to-r from-cyan-500 via-pink-500 to-purple-600 hover:from-cyan-400 hover:to-pink-400 text-white font-black text-xl rounded-full shadow-xl glow-box-pink transform hover:scale-105 active:scale-95 transition-all">
        START GAME
      </button>
    </div>

  </div>

  <!-- FALLBACK CANVAS FOR DIRECT RENDER IF WEBGL Context Fails -->
  <canvas id="fallback-canvas" class="fallback-canvas"></canvas>

  <!-- A-FRAME 3D SCENE -->
  <a-scene id="main-scene" game-manager embedded vr-mode-ui="enabled: true">
    <!-- FIXED CAMERA FRAME -->
    <a-entity id="camera-rig" position="0 0 10">
      <a-camera id="main-camera" look-controls="enabled: false" wasd-controls="enabled: false" fov="50"></a-camera>
    </a-entity>

    <!-- VR CONTROLLER ENTITIES -->
    <a-entity id="left-hand" laser-controls="hand: left" raycaster="objects: .grab-target, #platform-mesh; far: 20"></a-entity>
    <a-entity id="right-hand" laser-controls="hand: right" raycaster="objects: .grab-target, #platform-mesh; far: 20"></a-entity>

    <!-- LIGHTING -->
    <a-ambient-light color="#ffffff" intensity="1.5"></a-ambient-light>
    <a-directional-light color="#00ffff" intensity="1.0" position="-5 10 5"></a-directional-light>

    <!-- SYNTHWAVE SKY BACKGROUND -->
    <a-sky color="#08041d"></a-sky>

    <!-- CONTAINER FOR DYNAMIC OBSTACLES -->
    <a-entity id="obstacle-container"></a-entity>

    <!-- MAIN PLATFORM (FLOOR WHERE PLAYER MOVES) -->
    <a-entity id="platform-group" position="0 -2.5 0">
      <!-- Platform Base Surface -->
      <a-box id="platform-mesh" class="grab-target" position="0 -0.5 0" width="10" height="1" depth="2" color="#1a0c3b"></a-box>
      <!-- Left & Right Boundary Pillars (X = ±4.8) -->
      <a-box position="-4.8 1 0" width="0.3" height="2" depth="0.5" color="#ff007f" material="emissive: #ff007f; emissiveIntensity: 0.8"></a-box>
      <a-box position="4.8 1 0" width="0.3" height="2" depth="0.5" color="#ff007f" material="emissive: #ff007f; emissiveIntensity: 0.8"></a-box>
    </a-entity>

    <!-- PLAYER CHARACTER -->
    <a-entity id="player" class="grab-target" position="0 -1.75 0">
      <a-cone radius-bottom="0.5" radius-top="0.05" height="1.2" color="#00ffff" material="emissive: #00ffff; emissiveIntensity: 0.7; roughness: 0.2">
        <a-sphere radius="0.22" position="0 0.2 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 1"></a-sphere>
        <a-light type="point" color="#00ffff" intensity="3" distance="3" position="0 -0.2 0"></a-light>
      </a-cone>
    </a-entity>
  </a-scene>

  <script>
    // --- WEB AUDIO SYNTHESIZER ---
    const audio = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playMoveSound() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.03);
        } catch(e) {}
      },
      playHitSound() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch(e) {}
      }
    };

    // --- GAME CONSTANTS & COLOR PALETTE ---
    const BOUNDS_X = 4.3; // Constrained strictly inside screen frame
    const PLAYER_SPEED = 12.0;
    const NEON_COLORS = ['#ff007f', '#00ffff', '#ffe600', '#00ff66', '#a100ff', '#ff5500', '#ff00aa'];

    let active = false;
    let playerX = 0;
    let score = 0;
    let survivalTime = 0;
    let spawnTimer = 0;
    let spawnInterval = 1.0;
    let obstacles = [];

    // Controls
    const keys = { KeyA: false, KeyD: false, ArrowLeft: false, ArrowRight: false };
    let touchLeft = false;
    let touchRight = false;
    let isDirectDragging = false;
    let activeVRHand = null;

    // DOM References
    const playerEl = document.getElementById('player');
    const obstacleContainer = document.getElementById('obstacle-container');
    const startOverlay = document.getElementById('start-overlay');
    const overlaySubtitle = document.getElementById('overlay-subtitle');
    const scoreDisplay = document.getElementById('score-display');
    const startBtn = document.getElementById('start-btn');
    const statusValEl = document.getElementById('status-val');
    const timerValEl = document.getElementById('timer-val');
    const scoreValEl = document.getElementById('score-val');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const fallbackCanvas = document.getElementById('fallback-canvas');
    const ctx2d = fallbackCanvas.getContext('2d');

    // Resize fallback canvas
    function resizeFallbackCanvas() {
      fallbackCanvas.width = window.innerWidth;
      fallbackCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeFallbackCanvas);
    resizeFallbackCanvas();

    // --- KEYBOARD LISTENERS ---
    window.addEventListener('keydown', (e) => { if (e.code in keys) keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { if (e.code in keys) keys[e.code] = false; });

    // --- DIRECT MOUSE & TOUCH SCREEN DRAGGING ---
    function updatePlayerPositionFromScreenX(clientX) {
      if (!active) return;
      const normalizedX = (clientX / window.innerWidth) * 2 - 1; // -1 to +1
      playerX = normalizedX * BOUNDS_X;
      playerX = Math.max(-BOUNDS_X, Math.min(BOUNDS_X, playerX));
      if (playerEl) {
        playerEl.setAttribute('position', `${playerX} -1.75 0`);
      }
      audio.playMoveSound();
    }

    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#ui-container') && !e.target.closest('#btn-left') && !e.target.closest('#btn-right')) return;
      isDirectDragging = true;
      audio.init();
      updatePlayerPositionFromScreenX(e.clientX);
    });

    window.addEventListener('mousemove', (e) => {
      if (isDirectDragging) updatePlayerPositionFromScreenX(e.clientX);
    });

    window.addEventListener('mouseup', () => { isDirectDragging = false; });

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        const touch = e.touches[0];
        if (touch.target.closest('#ui-container') && !touch.target.closest('#btn-left') && !touch.target.closest('#btn-right')) return;
        isDirectDragging = true;
        audio.init();
        updatePlayerPositionFromScreenX(touch.clientX);
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (isDirectDragging && e.touches.length > 0) {
        updatePlayerPositionFromScreenX(e.touches[0].clientX);
      }
    }, { passive: true });

    window.addEventListener('touchend', () => { isDirectDragging = false; });

    // Mobile buttons fallback
    const setupTouchBtn = (btn, setTouch) => {
      const start = (e) => { e.preventDefault(); setTouch(true); audio.init(); };
      const end = (e) => { e.preventDefault(); setTouch(false); };
      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', end);
      btn.addEventListener('mousedown', () => { setTouch(true); audio.init(); });
      btn.addEventListener('mouseup', () => { setTouch(false); });
    };
    setupTouchBtn(btnLeft, (v) => touchLeft = v);
    setupTouchBtn(btnRight, (v) => touchRight = v);

    // Format time display MM:SS.s
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 10);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms}`;
    }

    function resetGame() {
      obstacles.forEach(obs => {
        if (obs.el && obs.el.parentNode) obs.el.parentNode.removeChild(obs.el);
      });
      obstacles = [];
      playerX = 0;
      score = 0;
      survivalTime = 0;
      spawnTimer = 0;
      spawnInterval = 1.0;
      if (playerEl) playerEl.setAttribute('position', '0 -1.75 0');
      timerValEl.textContent = '00:00.0';
      scoreValEl.textContent = '0';
    }

    startBtn.addEventListener('click', () => {
      audio.init();
      resetGame();
      startOverlay.classList.add('hidden');
      statusValEl.textContent = 'ACTIVE';
      active = true;
    });

    function spawnObstacle() {
      const spawnX = (Math.random() - 0.5) * (BOUNDS_X * 2);
      const speed = 4.5 + Math.random() * 2.5 + Math.min(score * 0.05, 4.0);
      const radius = 0.35 + Math.random() * 0.2;
      const spawnY = 5.2; // Spawns directly inside frame
      const color = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];

      let el = null;
      if (obstacleContainer && obstacleContainer.sceneEl) {
        el = document.createElement('a-sphere');
        el.setAttribute('radius', radius);
        el.setAttribute('color', color);
        el.setAttribute('material', `emissive: ${color}; emissiveIntensity: 0.8; roughness: 0.2`);
        el.setAttribute('position', `${spawnX}${spawnY} 0`);
        obstacleContainer.appendChild(el);
      }

      obstacles.push({ x: spawnX, y: spawnY, speed, radius, color, el });
    }

    function gameOver() {
      audio.playHitSound();
      active = false;
      statusValEl.textContent = 'GAME OVER';
      const formattedTime = formatTime(survivalTime);
      const finalScore = Math.floor(score);
      overlaySubtitle.textContent = `Game Over! You survived for ${formattedTime} and scored${finalScore} points.`;
      scoreDisplay.textContent = `${formattedTime} (${finalScore} pts)`;
      startBtn.textContent = 'RESTART GAME';
      startOverlay.classList.remove('hidden');
    }

    // --- NATIVE A-FRAME COMPONENT SYSTEM TICK (VR SAFE LOOP) ---
    AFRAME.registerComponent('game-manager', {
      init: function () {
        this.setupVRControllers();
      },
      setupVRControllers: function () {
        const hands = [document.getElementById('left-hand'), document.getElementById('right-hand')];
        hands.forEach(hand => {
          if (!hand) return;

          const onSelectStart = () => {
            audio.init();
            activeVRHand = hand;
          };
          const onSelectEnd = () => {
            if (activeVRHand === hand) activeVRHand = null;
          };

          hand.addEventListener('selectstart', onSelectStart);
          hand.addEventListener('selectend', onSelectEnd);
          hand.addEventListener('squeezestart', onSelectStart);
          hand.addEventListener('squeezeend', onSelectEnd);
        });
      },
      tick: function (time, timeDelta) {
        if (!active) {
          drawFallbackFrame();
          return;
        }

        const dt = Math.min(timeDelta / 1000, 0.1);

        // 1. VR Hand Drag Steer Update
        if (activeVRHand && activeVRHand.object3D) {
          const handPos = activeVRHand.object3D.position;
          // Scale hand x movement onto ship track
          playerX = handPos.x * 2.5;
          playerX = Math.max(-BOUNDS_X, Math.min(BOUNDS_X, playerX));
          if (playerEl) playerEl.setAttribute('position', `${playerX} -1.75 0`);
          audio.playMoveSound();
        } else {
          // 2. Keyboard & Touch Buttons Input Movement
          let moveDir = 0;
          if (keys.KeyA || keys.ArrowLeft || touchLeft) moveDir -= 1;
          if (keys.KeyD || keys.ArrowRight || touchRight) moveDir += 1;

          if (moveDir !== 0) {
            playerX += moveDir * PLAYER_SPEED * dt;
            playerX = Math.max(-BOUNDS_X, Math.min(BOUNDS_X, playerX));
            if (playerEl) {
              playerEl.setAttribute('position', `${playerX
