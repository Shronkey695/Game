<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Synthwave Dodge: VR & Arcade Survival</title>
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Tailwind CSS for UI Overlay -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #050312;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
    }

    .glow-text-cyan {
      text-shadow: 0 0 8px #00ffff, 0 0 20px #00ffff;
    }

    .glow-text-pink {
      text-shadow: 0 0 8px #ff007f, 0 0 20px #ff007f;
    }

    .glow-box-pink {
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .glow-box-cyan {
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(0, 255, 255, 0.4);
    }

    /* Position VR mode button cleanly in bottom right */
    .a-enter-vr {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 50 !important;
    }

    /* Force canvas to fill viewport reliably */
    a-scene, canvas.fallback-canvas {
      width: 100vw !important;
      height: 100vh !important;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    a-scene {
      z-index: 1;
    }

    canvas.fallback-canvas {
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-black text-white">

  <!-- HUD & UI OVERLAY CONTAINER -->
  <div id="ui-container" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4
